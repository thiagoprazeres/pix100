<div class="min-h-screen flex flex-col">
    <div class="pb-16">
      @if (deferredPrompt()) {
        <div class="bg-blue-600 text-white p-3 flex justify-between items-center sm:px-6 z-50 sticky top-0 shadow-md">
          <div class="leading-tight">
            <p class="font-bold text-sm">Baixe o App PIX100</p>
            <p class="text-xs opacity-90">Acesso rápido e offline no seu celular!</p>
          </div>
          <ion-button size="small" fill="solid" (click)="installPwa()">Instalar</ion-button>
        </div>
      }
      <router-outlet></router-outlet>
    </div>

    @if (perfilService.perfil()) {
      <ion-tab-bar class="fixed bottom-0 inset-x-0 z-50 h-16">
        <ion-tab-button routerLink="/historico" routerLinkActive="tab-active">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 14v2.2l1.6 1"/><path d="M16 4h2a2 2 0 0 1 2 2v.832"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2"/><circle cx="16" cy="16" r="6"/><rect x="8" y="2" width="8" height="4" rx="1"/>
          </svg>
          <ion-label>Histórico</ion-label>
        </ion-tab-button>

        <ion-tab-button routerLink="/cobranca" routerLinkActive="tab-active">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>
          </svg>
          <ion-label>Cobrar</ion-label>
        </ion-tab-button>

        <ion-tab-button routerLink="/chaves" routerLinkActive="tab-active" class="relative">
          @if (!chavePixService.chaveAtiva()) {
            <ion-badge color="danger" class="absolute top-2 right-6 text-[0.5rem] min-w-2 min-h-2 p-0.5">!</ion-badge>
          }
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>
          </svg>
          <ion-label>Chaves</ion-label>
        </ion-tab-button>

        <ion-tab-button routerLink="/perfil" routerLinkActive="tab-active">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <ion-label>Perfil</ion-label>
        </ion-tab-button>
      </ion-tab-bar>
    }

    <div class="fixed bottom-2 right-2 text-[0.65rem] opacity-20 z-50 pointer-events-none font-mono">
      v{{ version }}
    </div>
</div>
