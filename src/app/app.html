<div class="min-h-screen flex flex-col bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100">
    <div class="pb-20">
      @if (deferredPrompt()) {
        <div class="bg-neutral-900 text-white p-3 flex justify-between items-center sm:px-6 z-50 sticky top-0 shadow-md dark:bg-white dark:text-neutral-900">
          <div class="leading-tight">
            <p class="font-bold text-sm">Baixe o App Origem100</p>
            <p class="text-xs opacity-90">Acesso rápido e offline no seu celular!</p>
          </div>
          <button mat-flat-button color="primary" class="!text-xs" (click)="installPwa()">Instalar</button>
        </div>
      }
      <router-outlet></router-outlet>
    </div>

    @if (perfilService.perfil()) {
      <nav class="fixed bottom-0 inset-x-0 z-50 h-16 bg-white dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-800 flex items-center justify-around">
        <a routerLink="/historico" routerLinkActive class="flex-1 flex flex-col items-center justify-center text-neutral-500 dark:text-neutral-400 no-underline transition text-[11px] font-medium" #rHistorico="routerLinkActive">
          <div class="px-5 py-1 rounded-full transition-colors flex items-center justify-center" [class.bg-neutral-200]="rHistorico.isActive" [class.text-neutral-900]="rHistorico.isActive" [class.dark:bg-neutral-800]="rHistorico.isActive" [class.dark:text-white]="rHistorico.isActive">
            <mat-icon>history</mat-icon>
          </div>
          <span class="mt-0.5" [class.font-semibold]="rHistorico.isActive" [class.text-neutral-900]="rHistorico.isActive" [class.dark:text-white]="rHistorico.isActive">Histórico</span>
        </a>

        <a routerLink="/cobranca" routerLinkActive class="flex-1 flex flex-col items-center justify-center text-neutral-500 dark:text-neutral-400 no-underline transition text-[11px] font-medium" #rCobrar="routerLinkActive">
          <div class="px-5 py-1 rounded-full transition-colors flex items-center justify-center" [class.bg-neutral-200]="rCobrar.isActive" [class.text-neutral-900]="rCobrar.isActive" [class.dark:bg-neutral-800]="rCobrar.isActive" [class.dark:text-white]="rCobrar.isActive">
            <mat-icon>qr_code</mat-icon>
          </div>
          <span class="mt-0.5" [class.font-semibold]="rCobrar.isActive" [class.text-neutral-900]="rCobrar.isActive" [class.dark:text-white]="rCobrar.isActive">Cobrar</span>
        </a>

        <a routerLink="/chaves" routerLinkActive class="flex-1 flex flex-col items-center justify-center text-neutral-500 dark:text-neutral-400 no-underline transition text-[11px] font-medium relative" #rChaves="routerLinkActive">
          @if (!chavePixService.chaveAtiva()) {
            <span class="absolute top-1 right-[30%] flex h-2 w-2 rounded-full bg-red-500"></span>
          }
          <div class="px-5 py-1 rounded-full transition-colors flex items-center justify-center" [class.bg-neutral-200]="rChaves.isActive" [class.text-neutral-900]="rChaves.isActive" [class.dark:bg-neutral-800]="rChaves.isActive" [class.dark:text-white]="rChaves.isActive">
            <mat-icon>key</mat-icon>
          </div>
          <span class="mt-0.5" [class.font-semibold]="rChaves.isActive" [class.text-neutral-900]="rChaves.isActive" [class.dark:text-white]="rChaves.isActive">Chaves</span>
        </a>

        <a routerLink="/carne-leao" routerLinkActive class="flex-1 flex flex-col items-center justify-center text-neutral-500 dark:text-neutral-400 no-underline transition text-[11px] font-medium" #rImposto="routerLinkActive">
          <div class="px-5 py-1 rounded-full transition-colors flex items-center justify-center" [class.bg-neutral-200]="rImposto.isActive" [class.text-neutral-900]="rImposto.isActive" [class.dark:bg-neutral-800]="rImposto.isActive" [class.dark:text-white]="rImposto.isActive">
            <mat-icon>receipt_long</mat-icon>
          </div>
          <span class="mt-0.5" [class.font-semibold]="rImposto.isActive" [class.text-neutral-900]="rImposto.isActive" [class.dark:text-white]="rImposto.isActive">Imposto</span>
        </a>

        <a routerLink="/perfil" routerLinkActive class="flex-1 flex flex-col items-center justify-center text-neutral-500 dark:text-neutral-400 no-underline transition text-[11px] font-medium" #rPerfil="routerLinkActive">
          <div class="px-5 py-1 rounded-full transition-colors flex items-center justify-center" [class.bg-neutral-200]="rPerfil.isActive" [class.text-neutral-900]="rPerfil.isActive" [class.dark:bg-neutral-800]="rPerfil.isActive" [class.dark:text-white]="rPerfil.isActive">
            <mat-icon>person</mat-icon>
          </div>
          <span class="mt-0.5" [class.font-semibold]="rPerfil.isActive" [class.text-neutral-900]="rPerfil.isActive" [class.dark:text-white]="rPerfil.isActive">Perfil</span>
        </a>
      </nav>
    }

    <div class="fixed bottom-2 right-2 text-[0.65rem] opacity-20 z-50 pointer-events-none font-mono">
      v{{ version }}
    </div>
</div>
